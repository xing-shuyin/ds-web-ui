# Bundled default config for the ds-web-ui jsonrpc runtime (from the official
# DeepSeek Harness SDK runtime bundle, 0.1.0-rc.6), adapted so it also works
# on Windows: the SDK bundle is Linux/macOS-only and mounts bash, but the Node
# runtime runs on Windows too — where there is no bash, so the shell executor
# and tool swap to PowerShell (dsh-pwsh-local + dsh-tool-pwsh). Both executors
# register the same `ctx.shell` seam; exactly one is enabled per platform.

# Stdio JSON-RPC server entry; without it the agent has no SDK client.
- id: sdk-jsonrpc-server
  name: '@deepseek-ai/dsh-sdk-jsonrpc-server'

# Agent spine; the SDK server creates agents per sessionId.
- id: agent-core
  name: '@deepseek-ai/dsh-agent-spine-demo'
  config:
    workspaceContext:
      maxBytes: 65536
    # Windows has no bash: disable the bash tool there; dsh-tool-pwsh below
    # takes over (same story as the official pwsh example composition).
    toolBash: !!js process.platform === 'win32' ? false : { timeoutMs: 60000 }
    # Windows: tell the model the shell is PowerShell 5.1 (no &&, no bash
    # aliases) so it stops emitting bash syntax that fails to parse.
    persona: !!js "process.platform === 'win32' ? 'You are a coding agent running on Windows. Your shell is Windows PowerShell 5.1 (powershell.exe). Use PowerShell syntax: separate commands with ; (the && operator is NOT supported), use Get-ChildItem / Get-Location / Get-Content instead of ls / pwd / cat, and never emit bash-style commands. Many legacy Chinese text files (.html/.txt/.md) are GBK/GB2312 encoded: the read tool decodes UTF-8 only and will show mojibake for them, so prefer Get-Content -Path <file> -Encoding Default (or GBK/GB2312) for such files, and never paste mojibake into your reasoning or answer — describe the decoded content instead.' : ''"

# Stock DeepSeek adapters. The adapter resolves DEEPSEEK_API_KEY through the
# credential seam and, with no provider mounted here, from the launching
# environment; DEEPSEEK_BASE_URL follows the same environment ladder.
- id: llm-deepseek
  name: '@deepseek-ai/dsh-llm-deepseek'

# JSONL persistence; $DSH_SESSION_ROOT wins over ./.sessions in the process cwd.
- id: sessions
  name: '@deepseek-ai/dsh-session-persistence-jsonl'
  config:
    root: !!js process.env.DSH_SESSION_ROOT ?? './.sessions'

# Persistence owns durable storage; this separate policy explicitly selects
# the request, tool-dispatch, and completed-step durability checkpoints.
- id: session-checkpoints
  name: '@deepseek-ai/dsh-session-checkpoint-policy'

# Managed child-process groups for the shell executor (spawn/kill/output plumbing).
- id: subprocess
  name: '@deepseek-ai/dsh-subprocess-local'

# Shell executor — one provider of `ctx.shell` per platform:
# bash on POSIX, PowerShell on Windows.
- id: bash
  name: '@deepseek-ai/dsh-bash-local'
  disabled: !!js process.platform === 'win32'
  config:
    cwd: !!js process.env.DSH_CWD ?? process.cwd()

- id: pwsh
  name: '@deepseek-ai/dsh-pwsh-local'
  disabled: !!js process.platform !== 'win32'
  config:
    cwd: !!js process.env.DSH_CWD ?? process.cwd()

# Model-facing PowerShell tool (Windows only; the bash tool is disabled above).
- id: tool-pwsh
  name: '@deepseek-ai/dsh-tool-pwsh'
  disabled: !!js process.platform !== 'win32'

# Local filesystem provider for workspace instruction loading. This does not
# expose model-facing file tools by itself.
- id: fs-local
  name: '@deepseek-ai/dsh-fs-local'
  config:
    cwd: !!js process.env.DSH_CWD ?? process.cwd()

# Goal 模式（DSH 原生）：同会话目标状态 + 自动延续轮 + 模型目标工具。
- id: goal
  name: '@deepseek-ai/dsh-goal'

- id: goal-round-driver
  name: '@deepseek-ai/dsh-goal-round-driver'

- id: tool-goal
  name: '@deepseek-ai/dsh-tool-goal'
